<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ESG Checklist AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Prevent white flash during theme loading but allow normal scrolling */
      html, body {
        background-color: #0A0A0B !important;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        /* Only prevent overscroll bounce, not regular scrolling */
        overscroll-behavior: none;
      }
      
      /* Extra coverage for overscroll bounce - only covers beyond viewport */
      html::before {
        content: '';
        position: fixed;
        top: -50vh;
        left: 0;
        right: 0;
        height: 50vh;
        background-color: #0A0A0B;
        z-index: -9999;
        pointer-events: none;
      }
      
      html::after {
        content: '';
        position: fixed;
        bottom: -50vh;
        left: 0;
        right: 0;
        height: 50vh;
        background-color: #0A0A0B;
        z-index: -9999;
        pointer-events: none;
      }
      
      #root {
        min-height: 100vh;
        background-color: #0A0A0B;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
